# Реліз (ARCHITECTURE.md, «Оновлення»): пуш тегу vX.Y.Z →
#   1) prepare: перевірка версії, typecheck і тести, чернетка релізу;
#   2) windows і mac паралельно збирають інсталятори й дозавантажують їх у чернетку;
#   3) publish: чернетка стає опублікованим релізом — застосунки бачать нову версію.
# Чернетку створюємо один раз заздалегідь: інакше паралельні завантаження electron-builder
# можуть створити кілька релізів з одним тегом.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # створити реліз і завантажити файли

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # версію бере з packageManager у package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Tag matches app version
        run: |
          APP_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не збігається з версією застосунку v$APP_VERSION (apps/desktop/package.json)"
            exit 1
          fi
      - name: Typecheck & tests
        run: |
          pnpm typecheck
          pnpm test
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Опис релізу — розділ версії з CHANGELOG.md (scripts/changelog.mjs).
        run: |
          node scripts/changelog.mjs "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "VNami $GITHUB_REF_NAME" --notes-file release-notes.md

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # На Windows є rcedit: іконка й метадані .exe (на Mac цей крок для Windows-збірки вимкнено).
            args: --win --x64 --config.win.signAndEditExecutable=true
          - os: macos-latest
            # Універсальна збірка (Apple Silicon + Intel) з ad-hoc підписом, див. electron-builder.yml.
            args: --mac --universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build & upload
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-vite build && pnpm exec electron-builder ${{ matrix.args }} --publish always

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
