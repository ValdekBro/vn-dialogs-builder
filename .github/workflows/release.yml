# Release (ARCHITECTURE.md, "Updates"): pushing tag vX.Y.Z →
#   1) prepare: version check, typecheck and tests, draft release;
#   2) windows and mac build installers in parallel and upload them to the draft;
#   3) publish: the draft becomes a published release — apps see the new version.
# The draft is created once up front: otherwise parallel electron-builder uploads
# can create several releases for the same tag.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release and upload files

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # takes the version from packageManager in package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Tag matches app version
        run: |
          APP_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version v$APP_VERSION (apps/desktop/package.json)"
            exit 1
          fi
      - name: Typecheck & tests
        run: |
          pnpm typecheck
          pnpm test
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Release notes are the version's section of CHANGELOG.md (scripts/changelog.mjs).
        run: |
          node scripts/changelog.mjs "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "VNami $GITHUB_REF_NAME" --notes-file release-notes.md

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # Windows has rcedit: .exe icon and metadata (on Mac this step is disabled for the Windows build).
            args: --win --x64 --config.win.signAndEditExecutable=true
          - os: macos-latest
            # Separate Apple Silicon and Intel builds with an ad-hoc signature, see electron-builder.yml.
            args: --mac --arm64 --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build & upload
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-vite build && pnpm exec electron-builder ${{ matrix.args }} --publish always

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
