# App packaging (ARCHITECTURE.md, section 1). Build: `pnpm dist:win`.
appId: app.vnami.desktop
productName: VNami
copyright: VNami
directories:
  output: release
  buildResources: build
# All dependencies are already bundled into out/ (electron.vite.config.ts), so only built files are packaged.
files:
  - out/**
  - package.json
# The MCP bridge for the Claude app is started by another process (VNami in Node mode), so the script lives outside the archive.
asarUnpack:
  - out/main/mcp-bridge.js
npmRebuild: false
nodeGypRebuild: false
# Updates (ARCHITECTURE.md, "Updates"): releases on GitHub, the app reads latest.yml from there.
publish:
  provider: github
  owner: ValdekBro
  repo: vn-dialogs-builder
  # CI creates a draft release up front, electron-builder uploads files into it,
  # and the last workflow step publishes it (.github/workflows/release.yml).
  releaseType: draft
win:
  # Installer only: only it can update itself (the portable build was removed).
  target:
    - target: nsis
      arch: [x64]
  # Without Wine on macOS the .exe icon and metadata cannot be changed. CI on Windows enables this step
  # (`--config.win.signAndEditExecutable=true` in .github/workflows/release.yml).
  signAndEditExecutable: false
# macOS (ARCHITECTURE.md, "Updates"): separate Apple Silicon and Intel builds. A universal build
# carries two copies of Electron and is twice the size.
# No paid Developer ID — ad-hoc signature: the app runs, but auto-update on Mac
# is impossible (Squirrel.Mac requires the same developer signature), so the app only offers
# to download the new version. The zip is needed for latest-mac.yml, which the app uses to see new versions.
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  identity: "-"
  hardenedRuntime: false
  artifactName: VNami-${version}-mac-${arch}.${ext}
dmg:
  artifactName: VNami-${version}-mac-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: VNami
  artifactName: VNami-Setup-${version}.${ext}
